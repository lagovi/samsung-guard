name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
      - name: Bootstrap signing keystore (uber-apk-signer debug key)
        # The Guard APK must be signed with the same debug key as the custom
        # Viber "api" build — only then does Viber's LiteAPI provider accept
        # our calls. The key ships inside the official uber-apk-signer jar;
        # we extract it here, pinned by checksum. Never committed to the repo.
        run: |
          mkdir -p keystore
          curl -fsSL -o /tmp/uas.jar \
            "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar"
          echo "e1299fd6fcf4da527dd53735b56127e8ea922a321128123b9c32d619bba1d835  /tmp/uas.jar" | sha256sum -c -
          cd /tmp && unzip -o -j uas.jar debug.keystore -d /tmp
          echo "161a0018f33277e842534f5443fdd36683359b4950f4dc006c1648895cb073b2  /tmp/debug.keystore" | sha256sum -c -
          cp /tmp/debug.keystore "${GITHUB_WORKSPACE}/keystore/uber-debug.keystore"
      - name: Configure local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Grant execute
        run: chmod +x gradlew
      - name: Build debug APK
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VIBER_OWNER_PHONE: ${{ secrets.VIBER_OWNER_PHONE }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: samsung-guard-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
